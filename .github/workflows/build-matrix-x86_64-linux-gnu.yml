name: Build Matrix — x86_64-unknown-linux-gnu

# Task 48 §Exit Criteria #1: manual lane for the production primary
# triple. Runs cargo check + clippy + test compilation on the production
# pg18 target. Backend execution runs in the PG18 pgrx lane.
#
# Status: manual.

on:
  workflow_dispatch:

concurrency:
  group: build-matrix-x86_64-linux-gnu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: ${{ matrix.pg }} / ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [pg18]
        toolchain: [1.95.0]
    env:
      PGRX_HOME: /tmp/tqvector_pgrx_home
      RUSTFLAGS: "-C target-cpu=x86-64 -C link-arg=-Wl,--unresolved-symbols=ignore-all"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.pg }}-${{ matrix.toolchain }}

      - name: Install PG headers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          mkdir -p "$PGRX_HOME"
          sudo curl --fail --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-18 clang llvm pkg-config libssl-dev

      - name: Set PGRX_PG_CONFIG_PATH (pg18)
        if: matrix.pg == 'pg18'
        run: echo "PGRX_PG_CONFIG_PATH=/usr/lib/postgresql/18/bin/pg_config" >> $GITHUB_ENV

      - name: cargo check
        run: cargo check --all-targets --no-default-features --features ${{ matrix.pg }}

      - name: cargo clippy
        run: cargo clippy --all-targets --no-default-features --features ${{ matrix.pg }} -- -D warnings

      - name: cargo test compile
        run: cargo test --no-run --no-default-features --features ${{ matrix.pg }}
