name: Soak

# Task 48 §Exit Criteria #2: manual `make soak DURATION=24h` artifact
# capture. Runs the in-process quantizer cache soak and surfaces the
# resulting JSON (RSS + slope) for review packets.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration (humantime, e.g. 24h)"
        default: "24h"
        required: false

concurrency:
  group: soak-weekly
  cancel-in-progress: false

jobs:
  soak:
    name: 24h quantizer-cache soak
    runs-on: ubuntu-24.04
    timeout-minutes: 1500
    env:
      PGRX_HOME: /tmp/tqvector_pgrx_home
      PGRX_PG_CONFIG_PATH: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: soak-weekly-pg18

      - name: Install PG headers (for ecaz-cli compile)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          mkdir -p "$PGRX_HOME"
          sudo curl --fail --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-18 clang llvm pkg-config libssl-dev

      - name: cargo build ecaz-cli (release)
        run: cargo build -p ecaz-cli --bin ecaz --release

      - name: Run soak
        run: |
          DURATION="${{ github.event.inputs.duration }}"
          : "${DURATION:=24h}"
          ./scripts/parse_humantime.sh "$DURATION" > /tmp/soak-seconds
          SEC=$(cat /tmp/soak-seconds)
          ./target/release/ecaz stress soak-quant-cache \
            --duration-seconds "$SEC" \
            --workers 4 \
            --log-output target/soak-weekly.json

      - name: Upload soak summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-weekly-${{ github.run_id }}
          path: target/soak-weekly.json
