name: Fuzz Cross-Pollinate (weekly)

# Task 46 §Exit Criteria #3: manual cross-engine campaign (libFuzzer +
# Honggfuzz + AFL+) with corpus minimize-and-commit afterwards.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Per-target per-engine duration (seconds)"
        default: "120"
        required: false

concurrency:
  group: fuzz-cross-pollinate-weekly
  cancel-in-progress: false

jobs:
  cross-pollinate:
    name: libFuzzer + AFL+ + Honggfuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PGRX_HOME: /tmp/tqvector_pgrx_home
      PGRX_PG_CONFIG_PATH: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-cross-pollinate-weekly

      - name: Install PG headers + AFL + Honggfuzz
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          mkdir -p "$PGRX_HOME"
          sudo curl --fail --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-18 clang llvm pkg-config libssl-dev honggfuzz
          cargo install cargo-fuzz cargo-afl

      - name: Run cross-pollinate campaign
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.seconds }}
        run: |
          : "${FUZZ_SECONDS:=120}"
          make fuzz-cross-pollinate

      - name: Upload merged corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-cross-pollinate-corpus-${{ github.run_id }}
          path: fuzz/corpus/
