name: Build Matrix — aarch64-apple-darwin

# Task 48 §Exit Criteria #1: per-PR lane for the developer-default
# triple. pg18 only (pg17 macOS coverage is uninteresting — production
# is linux). Honors the known macOS `_BufferBlocks` dyld blocker by
# limiting runtime tests to the compile + ecaz-cli + Miri-able subset
# (feedback_dyld_buffer_blocks_known).
#
# Status: blocking (per docs/build-matrix.md cadence policy).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-matrix-aarch64-darwin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    name: pg18 / stable
    runs-on: macos-14
    env:
      PGRX_HOME: /tmp/tqvector_pgrx_home
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-darwin-pg18-stable

      - name: Install PG18
        run: |
          brew update
          brew install postgresql@18 || true
          mkdir -p "$PGRX_HOME"
          echo "PGRX_PG_CONFIG_PATH=$(brew --prefix postgresql@18)/bin/pg_config" >> $GITHUB_ENV

      - name: cargo check
        run: cargo check --all-targets --no-default-features --features pg18

      - name: cargo clippy
        run: cargo clippy --all-targets --no-default-features --features pg18 -- -D warnings

      # Runtime tests are skipped on macOS pending the _BufferBlocks
      # dyld blocker resolution. ecaz-cli compile + clippy is the
      # validated surface; per feedback_dyld_buffer_blocks_known
      # runtime is validated via Linux runners + Miri.
      - name: ecaz-cli compile
        run: cargo build -p ecaz-cli --bin ecaz
