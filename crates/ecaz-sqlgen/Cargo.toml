[package]
name = "ecaz-sqlgen"
version = "0.1.0"
edition = "2021"
description = "ECAZ-grammar SQL generator for the make sqlsmith-ecaz nightly fuzz lane."
rust-version = "1.78"
license = "MIT"

[[bin]]
name = "ecaz-sqlgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
